name: CI Backend

on:
  pull_request:
    paths:
      - "src/services/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "TestPassword!1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestPassword!1' -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Note: Azure Cosmos DB Emulator runs on Windows. For full E2E
      # integration tests against Cosmos, use a real Cosmos DB
      # connection in the dev/test environment (see scripts/seed-dev-tenant.py).
    env:
      ConnectionStrings__Sql: "Server=localhost,1433;Database=takumi_test;User Id=sa;Password=TestPassword!1;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit + integration tests
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Coverage gate
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coveragereport -reporttypes:Html
          echo "Coverage report: coveragereport/index.html"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: backend
          fail_ci_if_error: false

      - name: Vulnerable package scan
        run: dotnet list package --vulnerable --include-transitive

      - name: Banned API check
        run: dotnet build --no-restore /p:TreatWarningsAsErrors=true /p:WarningsAsErrors=""
