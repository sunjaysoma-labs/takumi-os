name: CI IaC

on:
  pull_request:
    paths:
      - "terraform/**"
      - "k8s/**"
      - ".github/workflows/ci-iac.yml"
  push:
    branches: [main]

concurrency:
  group: ci-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validate + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: false

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (dev)
        run: |
          cd env/dev
          terraform init -backend=false
          terraform validate
        env:
          TF_VAR_environment: dev

  kustomize:
    name: Kustomize build + kubeval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Kustomize build (all overlays)
        run: |
          for env in dev test prod; do
            echo "==> kustomize build k8s/overlays/$env"
            kustomize build k8s/overlays/$env > /tmp/$env.yaml
            kubeconform -strict -summary /tmp/$env.yaml
          done
