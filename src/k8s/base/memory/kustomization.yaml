apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifest for the Memory Service on AKS.
# Overlays (env/dev, env/test, env/prod) live in
# src/k8s/overlays/<env>/ and patch this base.

resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - hpa.yaml
  - podmonitor.yaml

commonLabels:
  app.kubernetes.io/name: memory
  app.kubernetes.io/part-of: takumi-os
  app.kubernetes.io/component: memory-service
  takumi.ai/tenant-isolation: enforced
